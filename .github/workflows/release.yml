# Pushing a tag like v1.0.0 builds, signs, notarizes and publishes DockPin-<version>.zip as a GitHub release.
# Repository secrets it needs (Settings > Secrets and variables > Actions):
#   DEVELOPER_ID_P12_BASE64   base64 of the "Developer ID Application" certificate + key exported as .p12
#   DEVELOPER_ID_P12_PASSWORD password of that .p12
#   NOTARY_APPLE_ID           Apple ID used for notarization
#   NOTARY_PASSWORD           app-specific password of that Apple ID
#   NOTARY_TEAM_ID            Apple developer team ID
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Info.plist v$version"; exit 1; }

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Store notary credentials
        run: xcrun notarytool store-credentials DockPin-notary --apple-id "$APPLE_ID" --password "$PASSWORD" --team-id "$TEAM_ID"
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}

      - name: Build, sign, notarize
        run: scripts/release.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/$GITHUB_REF_NAME.md"
          gh release create "$GITHUB_REF_NAME" "dist/DockPin-$version.zip" "dist/DockPin-$version.zip.sha256" \
            --title "DockPin $version" --notes-file "$notes"

# Pushing a tag like v1.0.0 builds, signs, notarizes and publishes DockPin-<version>.zip (+ .sha256 and a stable-named
# DockPin.zip) as a GitHub release; if the release already exists, it replaces those assets.
# Repository secrets it needs (Settings > Secrets and variables > Actions):
#   DEVELOPER_ID_P12_BASE64   base64 of the "Developer ID Application" certificate + key exported as .p12
#   DEVELOPER_ID_P12_PASSWORD password of that .p12
#   NOTARY_KEY_P8_BASE64      base64 of an App Store Connect Team API key (.p8) used for notarization
#   NOTARY_KEY_ID             that key's ID
#   NOTARY_ISSUER_ID          the App Store Connect issuer ID
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Info.plist v$version"; exit 1; }

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Store notary credentials
        run: |
          key="$RUNNER_TEMP/notary.p8"
          echo "$KEY_P8_BASE64" | base64 --decode > "$key"
          xcrun notarytool store-credentials DockPin-notary --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
          rm "$key"
        env:
          KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}

      - name: Build, sign, notarize
        run: scripts/release.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/$GITHUB_REF_NAME.md"
          assets="dist/DockPin-$version.zip dist/DockPin-$version.zip.sha256 dist/DockPin.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $assets --clobber
          else
            gh release create "$GITHUB_REF_NAME" $assets --title "DockPin $version" --notes-file "$notes"
          fi
